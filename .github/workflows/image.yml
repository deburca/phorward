name: Image smoke test

# Heavy (about 2.5 GB image, minutes to build), so it runs weekly and on demand, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, php: "8.3", profile: drupal-module, project: tests/fixtures/smoke_module}
          - {os: ubuntu-latest, php: "8.3", profile: php-library, project: tests/fixtures/php_library_sample}
          - {os: ubuntu-24.04-arm, php: "8.3", profile: drupal-module, project: tests/fixtures/smoke_module}
          - {os: ubuntu-24.04-arm, php: "8.3", profile: php-library, project: tests/fixtures/php_library_sample}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build the image from the fixture project
        run: server/build-image --profile "${{ matrix.profile }}" --module "${{ matrix.project }}" --php "${{ matrix.php }}"
      - name: Smoke test
        run: server/smoke-test --profile "${{ matrix.profile }}" --module "${{ matrix.project }}" --php "${{ matrix.php }}"
