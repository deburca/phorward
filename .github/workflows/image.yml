name: Image smoke test

# Heavy (about 2.5 GB image, minutes to build), so it runs weekly and on demand, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        php: ["8.3"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from the fixture module
        run: server/build-image --module tests/fixtures/smoke_module --php "${{ matrix.php }}"
      - name: Smoke test
        run: server/smoke-test --module tests/fixtures/smoke_module --image "phorward:smoke_module-php${{ matrix.php }}"
